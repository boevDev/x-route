<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
        <!-- Градиент для активного маршрута -->
        <linearGradient id="active-flow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#45d6c4" />
            <stop offset="100%" stop-color="#2a8277" />
        </linearGradient>

        <!-- Свечение для активных элементов -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#45d6c4" flood-opacity="0.4" />
        </filter>

        <!-- Тень от самой иконки -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.6" />
        </filter>
    </defs>

    <!-- Внешний фон (сквиркл), цвет: --bg -->
    <rect x="32" y="32" width="960" height="960" rx="224" fill="#0a0e14" filter="url(#shadow)" />

    <!-- Внутренняя панель, цвет: --panel + рамка --line -->
    <rect x="64" y="64" width="896" height="896" rx="192" fill="#12171f" stroke="#212934" stroke-width="12" />

    <!-- Неактивный маршрут (Провайдер DHCP), цвет: --line -->
    <path d="M 256 768 L 768 256" stroke="#212934" stroke-width="72" stroke-linecap="round" />

    <!-- Активный маршрут (Кастомный DNS), цвет: --accent -->
    <path d="M 256 256 L 768 768" stroke="url(#active-flow)" stroke-width="72" stroke-linecap="round"
        filter="url(#glow)" />

    <!-- Центральный узел (Node) -->
    <circle cx="512" cy="512" r="160" fill="#171e27" stroke="#45d6c4" stroke-width="20" filter="url(#glow)" />

    <!-- Иконка Щита (ShieldCheck) в центре -->
    <path d="M 512 400 L 430 440 V 520 C 430 580 460 630 512 660 C 564 630 594 580 594 520 V 440 Z" fill="#12171f"
        stroke="#45d6c4" stroke-width="24" stroke-linejoin="round" />

    <!-- Галочка внутри щита -->
    <path d="M 470 540 L 500 570 L 555 490" fill="none" stroke="#45d6c4" stroke-width="24" stroke-linecap="round"
        stroke-linejoin="round" />

    <!-- Точки входа/выхода данных (Пакеты) -->
    <circle cx="256" cy="256" r="28" fill="#12171f" stroke="#45d6c4" stroke-width="12" />
    <circle cx="768" cy="768" r="28" fill="#12171f" stroke="#45d6c4" stroke-width="12" />
    <circle cx="256" cy="768" r="28" fill="#12171f" stroke="#212934" stroke-width="12" />
    <circle cx="768" cy="256" r="28" fill="#12171f" stroke="#212934" stroke-width="12" />
</svg>